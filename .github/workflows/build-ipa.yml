name: Build unsigned IPA

# Every push to main publishes a GitHub pre-release ("release candidate") with the unsigned .ipa attached.
# Run manually with release_type = final to publish a full release instead.
# Pull requests only build + test (artifact attached to the run, no release).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_type:
        description: "rc = pre-release candidate, final = full release (vX.Y.Z)"
        type: choice
        options: [rc, final]
        default: rc

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: Drillside.xcodeproj
  SCHEME: Drillside
  APP_NAME: Drillside

jobs:
  build-ipa:
    name: Archive, package & publish
    needs: unit-tests
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          # Prefer the newest stable Xcode 16.x on the image, else the newest stable Xcode.
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -1)
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Work out version
        id: ver
        run: |
          MARKETING=$(grep -m1 'MARKETING_VERSION = ' "$PROJECT/project.pbxproj" | sed -E 's/.*= ([^;]+);/\1/')
          BUILD=${{ github.run_number }}
          if [ "${{ inputs.release_type }}" = "final" ]; then
            TAG="v$MARKETING"; TITLE="Drillside $MARKETING"
          else
            TAG="v$MARKETING-rc.$BUILD"; TITLE="Drillside $MARKETING RC $BUILD"
          fi
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Version $MARKETING ($BUILD) → $TAG"

      - name: Archive (no code signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into .ipa
        id: pkg
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
          test -d "$APP" || { echo "::error::$APP not found"; ls -R "$RUNNER_TEMP/$APP_NAME.xcarchive" | head -50; exit 1; }
          test -d "$APP/PlugIns/DrillsideWidgets.appex" || { echo "::error::Live Activity extension missing from the app bundle"; exit 1; }
          echo "Bundle id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "Version:   $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"))"
          echo "Live Activities: $(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist")"
          if find "$APP" -name '*.xcent' | grep -q .; then
            echo "::warning::Unexpected entitlements found"; find "$APP" -name '*.xcent' -exec cat {} \;
          fi
          IPA="$APP_NAME-${{ steps.ver.outputs.tag }}-unsigned.ipa"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry "$IPA" Payload)
          ls -lh "build/$IPA"
          echo "ipa=build/$IPA" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          TITLE: ${{ steps.ver.outputs.title }}
          IPA: ${{ steps.pkg.outputs.ipa }}
        run: |
          set -euo pipefail
          PREV=$(git tag --list 'v*' --sort=-creatordate | grep -v "^$TAG$" | head -1 || true)
          {
            echo "## 📲 Install"
            echo "1. Download **$(basename "$IPA")** below."
            echo "2. Sign & install it with **AltStore**, **SideStore** or **Sideloadly** using your Apple ID."
            echo "3. Free Apple IDs need a re-sign every 7 days (AltStore/SideStore can auto-refresh)."
            echo ""
            echo "Includes the Drillside app + its Live Activity extension (Dynamic Island). Unsigned, no entitlements."
            echo ""
            echo "## 📝 Changes"
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "$PREV..$GITHUB_SHA"
            else
              git log --no-merges --pretty='- %s' -n 20 "$GITHUB_SHA"
            fi
          } > notes.md
          cat notes.md
          if [ "${{ inputs.release_type }}" = "final" ]; then
            gh release create "$TAG" "$IPA" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md --latest
          else
            gh release create "$TAG" "$IPA" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md --prerelease
          fi
          URL=$(gh release view "$TAG" --json url --jq .url)
          echo "### 🚀 [$TITLE]($URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Attached: \`$(basename "$IPA")\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PR build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-pr-${{ github.event.pull_request.number }}-unsigned-ipa
          path: ${{ steps.pkg.outputs.ipa }}
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: Unit tests (simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -1)
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          def ver(rt):
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for rt in sorted((r for r in data if "iOS" in r), key=ver, reverse=True):
              phones = [d for d in data[rt] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          echo "Simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
